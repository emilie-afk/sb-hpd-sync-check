<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HPD — Not Yet in Shopify</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0; padding: 20px 24px;
      background: #f8f9fa; color: #111827; min-height: 100vh;
    }
    .header {
      display: flex; align-items: flex-start;
      justify-content: space-between; margin-bottom: 20px; gap: 16px;
    }
    .header-left h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
    .meta { font-size: 12px; color: #6b7280; }
    .refresh-btn {
      flex-shrink: 0; background: #16a34a; color: white; border: none;
      padding: 8px 18px; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 500; transition: background .15s;
    }
    .refresh-btn:hover { background: #15803d; }
    .refresh-btn:disabled { background: #9ca3af; cursor: not-allowed; }

    /* Loading */
    .loading {
      display: flex; align-items: center; gap: 10px;
      color: #6b7280; font-size: 14px; padding: 40px 0;
    }
    .spinner {
      width: 18px; height: 18px; border: 2px solid #e5e7eb;
      border-top-color: #16a34a; border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-box {
      background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px;
      padding: 16px 20px; color: #991b1b; font-size: 14px;
    }

    /* Section label */
    .section-label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; margin: 20px 0 8px; color: #374151;
    }
    .section-label.review { color: #b45309; }

    /* Tables */
    .table-wrap {
      background: white; border-radius: 12px; overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .table-wrap.review {
      box-shadow: 0 1px 4px rgba(180,83,9,.15);
      border: 1px solid #fde68a;
    }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: #f9fafb; font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .06em;
      padding: 10px 16px; text-align: left; color: #6b7280;
      border-bottom: 1px solid #f3f4f6;
    }
    .table-wrap.review thead th { background: #fffbeb; }
    tbody tr:hover td { background: #f9fafb; }
    td { padding: 10px 16px; font-size: 14px; border-bottom: 1px solid #f3f4f6; }
    tbody tr:last-child td { border-bottom: none; }
    .td-num  { color: #d1d5db; width: 36px; font-size: 13px; }
    .td-name { font-weight: 500; color: #111827; }
    .td-note { font-size: 12px; color: #92400e; }
    .common  { color: #9ca3af; font-weight: 400; font-style: italic; font-size: 13px; }
    .badge-review {
      display: inline-block; background: #fef3c7; color: #92400e;
      border: 1px solid #fde68a; border-radius: 4px;
      font-size: 11px; font-weight: 600; padding: 1px 7px; margin-left: 8px;
      vertical-align: middle;
    }
    .footer { margin-top: 10px; font-size: 12px; color: #9ca3af; text-align: right; }

    /* Password gate */
    #gate {
      display: flex; align-items: center; justify-content: center;
      min-height: 80vh;
    }
    .gate-box {
      background: white; border-radius: 16px; padding: 36px 40px;
      box-shadow: 0 2px 12px rgba(0,0,0,.1); text-align: center; width: 320px;
    }
    .gate-box h2 { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
    .gate-box p  { font-size: 13px; color: #6b7280; margin: 0 0 20px; }
    .gate-box input {
      width: 100%; padding: 10px 14px; border: 1px solid #d1d5db;
      border-radius: 8px; font-size: 14px; outline: none;
      transition: border-color .15s;
    }
    .gate-box input:focus { border-color: #16a34a; }
    .gate-box button {
      margin-top: 12px; width: 100%; background: #16a34a; color: white;
      border: none; padding: 10px; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .gate-box button:hover { background: #15803d; }
    .gate-error { color: #dc2626; font-size: 13px; margin-top: 10px; }
    [hidden] { display: none !important; }
    .notice { margin-bottom: 12px; }
    .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .signout-btn {
      background: white; color: #374151; border: 1px solid #d1d5db;
      padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
    }
    .signout-btn:hover { background: #f3f4f6; }
    .warn-box {
      background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px;
      padding: 12px 16px; color: #92400e; font-size: 13px; margin-bottom: 12px;
    }
    .warn-box strong { display: block; margin-bottom: 4px; }
    .section-label.unverified { color: #b91c1c; }
    .table-wrap.unverified { border: 1px solid #fecaca; }
  </style>
</head>
<body>

  <!-- Password gate (shown before data loads) -->
  <div id="gate" hidden>
    <div class="gate-box">
      <h2>🌿 HPD Dashboard</h2>
      <p>Enter the password to continue</p>
      <form id="gateForm" autocomplete="on">
        <input type="password" id="pwInput" placeholder="Password" autocomplete="current-password" maxlength="256" required>
        <button type="submit" id="unlockBtn">Continue</button>
      </form>
      <div class="gate-error" id="gateError"></div>
    </div>
  </div>

  <!-- Main app (hidden until password accepted) -->
  <div id="app" hidden>
    <div class="header">
      <div class="header-left">
        <h1>🌿 HPD — Not Yet in Shopify</h1>
        <div class="meta" id="meta">Loading live data…</div>
      </div>
      <div class="header-actions">
        <button class="refresh-btn" id="refreshBtn" type="button" disabled>↻ Refresh</button>
        <button class="signout-btn" id="signoutBtn" type="button">Sign out</button>
      </div>
    </div>
    <div class="error-box notice" id="notice" role="alert" hidden></div>
    <div id="content"></div>
    <div class="footer" id="footer"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
